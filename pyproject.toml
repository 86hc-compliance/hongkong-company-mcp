[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hongkong-company-mcp"
version = "1.2.4"
description = "Hong Kong Company MCP Server (com.86hc/hongkong-company) - Search 3.9M+ HK companies (CR No, BRN, UBO, status) & order official ICRIS filings (NAR1, NNC1, CI) via Stripe. Zero-config free trial by 86hc.com."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "HC Business (恒诚商务)", email = "support@86hc.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "hong-kong",
    "hongkong",
    "company-registry",
    "icris",
    "kyb",
    "due-diligence",
    "86hc",
    "nar1",
    "nnc1",
    "brn"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
fastmcp = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
hongkong-company-mcp = "server:main"

[project.urls]
Homepage = "https://www.86hc.com"
Documentation = "https://www.86hc.com/user"
Repository = "https://github.com/86hc-compliance/hongkong-company-mcp"
Issues = "https://github.com/86hc-compliance/hongkong-company-mcp/issues"
Registry = "https://registry.modelcontextprotocol.io/v0.1/servers/com.86hc%2Fhongkong-company/versions/latest"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]

[tool.hatch.build.targets.sdist]
include = [
    "server.py",
    "README.md",
    "pyproject.toml",
]
